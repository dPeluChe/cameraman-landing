name: Scheduled checks

# Checks that need a browser or the network and so never belong in a PR gate: horizontal
# overflow at the declared widths, and whether every external link still answers. A failure
# here is a ticket, not a blocked merge. Also runs when this file changes, to prove it works.
on:
  schedule:
    - cron: "0 14 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/scheduled-checks.yml"
      - "scripts/check-external-links.mjs"
      - "scripts/check-responsive.mjs"

permissions:
  contents: read

jobs:
  checks:
    name: Responsive and external links
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SITE_URL: ${{ vars.SITE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: No horizontal overflow
        run: npm run responsive
      - name: External links answer
        run: node scripts/check-external-links.mjs
